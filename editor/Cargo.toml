[package]
name = "tungstengine-editor"
version = "0.1.0"
edition = "2024"

[features]
default = ["scene"]
2d = ["tungstengine/2d", "dep:winit"]
scene = ["tungstengine/3d", "tungstengine/dialog", "dep:glam", "dep:log", "dep:serde", "dep:toml", "dep:uuid", "dep:winit"]

[dependencies]
tungstengine = { path = "..", default-features = false }
glam = { version = "0.33.1", optional = true }
log = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
toml = { version = "0.8", optional = true }
uuid = { version = "1.23.3", features = ["v4", "serde"], optional = true }
winit = { version = "0.30.13", optional = true }
