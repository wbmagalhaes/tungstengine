[package]
name = "tungstengine-adventure"
version = "0.1.0"
edition = "2024"

[dependencies]
tungstengine = { path = "..", default-features = false, features = ["3d", "dialog"] }
env_logger = "0.11"
glam = "0.33.1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
toml = "0.8"
winit = "0.30.13"
